# Compose otherwise names the project after whatever directory the checkout sits in,
# and that name prefixes every volume. The grading sandbox is bind-mounted by the
# Docker daemon from an absolute host path that has to spell those volumes out
# (GRADING_DOCKER_*_MOUNT_ROOT), so a rename nobody chose - cloning into gitgrader-2,
# or into git-grader - silently points the hidden tests at a directory the daemon
# then creates empty, and every submission is graded against no tests and scored zero.
name: gitgrader

services:
  app:
    image: ghcr.io/git-grader/gitgrader:${GITGRADER_VERSION:-0.1.0-SNAPSHOT}
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      init-permissions:
        condition: service_completed_successfully
      runner:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: production
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://database:5432/gitgrader}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-gitgrader}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Set SPRING_DATASOURCE_PASSWORD in .env}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8080}
      APP_SUPPORT_EMAIL: ${APP_SUPPORT_EMAIL:-support@example.org}
      APP_ORGANIZATION_NAME: ${APP_ORGANIZATION_NAME:-Example Organization}
      GIT_SSH_HOST: ${GIT_SSH_HOST:-localhost}
      GIT_SSH_PORT: ${GIT_SSH_PORT:-2222}
      GIT_LISTEN_ADDRESS: ${GIT_LISTEN_ADDRESS:-0.0.0.0}
      GIT_LISTEN_PORT: ${GIT_LISTEN_PORT:-2222}
      GIT_HOST_KEY_PATH: /data/git/ssh/hostkey.ser
      GIT_REPOSITORY_DIRECTORY: /data/git/repositories
      GRADING_DOCKER_WORKSPACE_MOUNT_ROOT: ${GRADING_DOCKER_WORKSPACE_MOUNT_ROOT:-}
      GRADING_DOCKER_TESTS_MOUNT_ROOT: ${GRADING_DOCKER_TESTS_MOUNT_ROOT:-}
      GRADING_MAX_PARALLEL_JOBS: ${GRADING_MAX_PARALLEL_JOBS:-2}
      GRADING_DEFAULT_TIMEOUT: ${GRADING_DEFAULT_TIMEOUT:-120s}
      GRADING_DEFAULT_MEMORY_LIMIT: ${GRADING_DEFAULT_MEMORY_LIMIT:-512MB}
      GRADING_DEFAULT_CPU_LIMIT: ${GRADING_DEFAULT_CPU_LIMIT:-1.0}
      GRADING_DEFAULT_PID_LIMIT: ${GRADING_DEFAULT_PID_LIMIT:-256}
      GRADING_NETWORK_ENABLED: ${GRADING_NETWORK_ENABLED:-false}
      # Grading happens on the other side of a boundary: this container has no route to
      # the Docker API and asks the runner service for a sandbox instead.
      GRADING_RUNNER: remote
      GRADING_RUNNER_API_URL: http://runner:8080
      GRADING_RUNNER_API_SECRET: ${GRADING_RUNNER_API_SECRET:?Set GRADING_RUNNER_API_SECRET in .env - any long random string, shared with the runner}
      STORAGE_REPOSITORIES_DIRECTORY: /data/git/repositories
      STORAGE_TEMPLATES_DIRECTORY: /data/templates
      STORAGE_TESTS_DIRECTORY: /data/tests
      STORAGE_ARTIFACTS_DIRECTORY: /data/artifacts
      # Grading workspaces are exported here, so this has to satisfy two constraints at
      # once: the root filesystem is read-only, so it must sit inside a mounted volume,
      # and the runner translates a workspace to a host path by appending only the
      # directory's name to GRADING_DOCKER_WORKSPACE_MOUNT_ROOT, so it must be a direct
      # child of the volume that variable points at. The default of /data/tmp satisfies
      # neither and leaves every run failing to materialise the submitted commit.
      STORAGE_TEMP_DIRECTORY: /data/grading
      # Every setting docs/configuration.md tells an operator to put in .env has to be
      # named here, because Compose passes nothing through on its own. The LDAP block was
      # the expensive omission: installation.md walks an operator through setting the URL,
      # base DN and manager credentials, and none of them reached the application, which
      # then used the packaged defaults and pointed at localhost.
      SECURITY_LDAP_ENABLED: ${SECURITY_LDAP_ENABLED:-false}
      SECURITY_LDAP_URL: ${SECURITY_LDAP_URL:-}
      SECURITY_LDAP_BASE_DN: ${SECURITY_LDAP_BASE_DN:-}
      SECURITY_LDAP_MANAGER_DN: ${SECURITY_LDAP_MANAGER_DN:-}
      SECURITY_LDAP_MANAGER_PASSWORD: ${SECURITY_LDAP_MANAGER_PASSWORD:-}
      SECURITY_LDAP_USER_SEARCH_BASE: ${SECURITY_LDAP_USER_SEARCH_BASE:-ou=people}
      SECURITY_LDAP_USER_SEARCH_FILTER: ${SECURITY_LDAP_USER_SEARCH_FILTER:-(uid={0})}
      SECURITY_LDAP_GROUP_SEARCH_BASE: ${SECURITY_LDAP_GROUP_SEARCH_BASE:-ou=groups}
      SECURITY_LDAP_GROUP_SEARCH_FILTER: ${SECURITY_LDAP_GROUP_SEARCH_FILTER:-(member={0})}
      SECURITY_LDAP_INSTRUCTOR_GROUP: ${SECURITY_LDAP_INSTRUCTOR_GROUP:-gitgrader-instructors}
      SECURITY_LDAP_ADMIN_GROUP: ${SECURITY_LDAP_ADMIN_GROUP:-gitgrader-admins}
      SECURITY_RATE_REGISTRATION_IP: ${SECURITY_RATE_REGISTRATION_IP:-5}
      SECURITY_RATE_REGISTRATION_GLOBAL: ${SECURITY_RATE_REGISTRATION_GLOBAL:-200}
      SECURITY_RATE_RESULT_IP: ${SECURITY_RATE_RESULT_IP:-60}
      SECURITY_RATE_LOGIN_IP: ${SECURITY_RATE_LOGIN_IP:-10}
      SECURITY_RATE_SSH_IP: ${SECURITY_RATE_SSH_IP:-30}
      SECURITY_RATE_SUBMISSIONS_ASSIGNMENT: ${SECURITY_RATE_SUBMISSIONS_ASSIGNMENT:-20}
      SECURITY_RATE_SUBMISSIONS_STUDENT: ${SECURITY_RATE_SUBMISSIONS_STUDENT:-60}
      SECURITY_SESSION_TIMEOUT: ${SECURITY_SESSION_TIMEOUT:-PT8H}
      SECURITY_SESSION_COOKIE_NAME: ${SECURITY_SESSION_COOKIE_NAME:-GITGRADER_SESSION}
      APP_NAME: ${APP_NAME:-GitGrader}
      APP_DEFAULT_TIMEZONE: ${APP_DEFAULT_TIMEZONE:-UTC}
      APP_DOCUMENTATION_URL: ${APP_DOCUMENTATION_URL:-}
      APP_REGISTRATION_ENABLED: ${APP_REGISTRATION_ENABLED:-true}
      APP_REQUIRE_INSTRUCTOR_VERIFICATION: ${APP_REQUIRE_INSTRUCTOR_VERIFICATION:-false}
      APP_MAX_KEYS_PER_STUDENT: ${APP_MAX_KEYS_PER_STUDENT:-5}
      APP_RESULT_TOKEN_TTL: ${APP_RESULT_TOKEN_TTL:-P180D}
      APP_RESULT_TOKEN_ENTROPY_BITS: ${APP_RESULT_TOKEN_ENTROPY_BITS:-256}
      GIT_REQUIRE_SIGNED_COMMITS: ${GIT_REQUIRE_SIGNED_COMMITS:-true}
      GIT_MAX_PUSH_SIZE: ${GIT_MAX_PUSH_SIZE:-50MB}
      GIT_MAX_FILE_SIZE: ${GIT_MAX_FILE_SIZE:-10MB}
      GIT_MAX_FILE_COUNT: ${GIT_MAX_FILE_COUNT:-2000}
      GIT_SSH_USER: ${GIT_SSH_USER:-git}
      GRADING_LOG_SIZE_LIMIT: ${GRADING_LOG_SIZE_LIMIT:-1MB}
      GRADING_QUEUE_MAX_PENDING_STUDENT: ${GRADING_QUEUE_MAX_PENDING_STUDENT:-3}
      GRADING_QUEUE_MAX_PENDING_COURSE: ${GRADING_QUEUE_MAX_PENDING_COURSE:-500}
      GRADING_QUEUE_MAX_PENDING_GLOBAL: ${GRADING_QUEUE_MAX_PENDING_GLOBAL:-1000}
      GRADING_QUEUE_DRAIN_TIMEOUT: ${GRADING_QUEUE_DRAIN_TIMEOUT:-30s}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      LOG_LEVEL_GITGRADER: ${LOG_LEVEL_GITGRADER:-INFO}
      SPRINGDOC_UI_ENABLED: ${SPRINGDOC_UI_ENABLED:-false}
      SPRING_SHUTDOWN_PHASE_TIMEOUT: ${SPRING_SHUTDOWN_PHASE_TIMEOUT:-60s}
      SECURITY_LOCAL_ACCOUNTS_ENABLED: ${SECURITY_LOCAL_ACCOUNTS_ENABLED:-false}
      SECURITY_SESSION_SECURE_COOKIE: ${SECURITY_SESSION_SECURE_COOKIE:-true}
      AUDIT_IP_HASH_KEY: ${AUDIT_IP_HASH_KEY:-}
      AUDIT_RETENTION: ${AUDIT_RETENTION:-P365D}
      SERVER_FORWARD_HEADERS_STRATEGY: ${SERVER_FORWARD_HEADERS_STRATEGY:-none}
      # JGit caches filesystem timing attributes in a user config file and treats being
      # unable to write it as a hard failure, which surfaces as every signed commit being
      # reported invalid. The root filesystem is read-only, so it is pointed at the tmpfs
      # below. The cache is a performance aid and is expected to be rebuilt per start.
      XDG_CONFIG_HOME: /tmp
    ports:
      - "${HTTP_PORT:-8080}:8080"
      - "${SSH_PORT:-2222}:2222"
    volumes:
      - git-data:/data/git
      - grading-data:/data/grading
      - templates:/data/templates
      - tests:/data/tests
      - artifacts:/data/artifacts
      - ./config:/config:ro
      # No Docker socket here, deliberately. This container faces students and
      # instructors, and the socket is effective host root: one flaw in it would
      # otherwise have been enough to start a privileged container mounting /. It asks
      # the runner service below for a sandbox instead, over one narrow operation.
    # No container healthcheck: the image is built by buildpacks onto a minimal run
    # image that contains no shell and no HTTP client, so any in-container probe simply
    # fails to exec. A probe that can never succeed is worse than none, because the
    # container then reports "health: starting" forever and hides a crash loop behind
    # what looks like a slow boot. Probe readiness from outside instead - the endpoint
    # is documented in docs/operations.md:
    #   wget -qO- http://localhost:${HTTP_PORT:-8080}/actuator/health/readiness
    read_only: true
    tmpfs:
      - /tmp
    # Compose sends SIGTERM and then SIGKILLs 10 seconds later by default, which is far
    # less than a grading run needs to wind down: the application would be killed mid-run
    # on every redeploy, stranding the job until its 15 minute lease expired. This must
    # stay above spring.lifecycle.timeout-per-shutdown-phase.
    stop_grace_period: 90s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # The only container with the Docker socket, and the only reason it exists.
  #
  # Access to that socket is access to the host: a container can be asked for with the
  # root filesystem mounted and every capability held. Keeping it here means a flaw in
  # the web application - a dependency, an injection, a stolen instructor session next to
  # a later bug - reaches an API that will do exactly one thing, "grade this", with the
  # limits and the hardening this service decides rather than the ones it is handed.
  #
  # It runs the same image as the app with two things switched off: it claims no jobs
  # from the queue, and it serves no SSH. It publishes no host port, so nothing outside
  # the internal network can ask it for anything at all.
  runner:
    image: ghcr.io/git-grader/gitgrader:${GITGRADER_VERSION:-0.1.0-SNAPSHOT}
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      init-permissions:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: production
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://database:5432/gitgrader}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-gitgrader}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Set SPRING_DATASOURCE_PASSWORD in .env}
      # This is the runner: it serves sandboxes, claims nothing, and accepts no pushes.
      GRADING_RUNNER_API_ENABLED: "true"
      GRADING_RUNNER_API_SECRET: ${GRADING_RUNNER_API_SECRET:?Set GRADING_RUNNER_API_SECRET in .env - any long random string, shared with the app}
      GRADING_QUEUE_ENABLED: "false"
      GIT_ENABLED: "false"
      # The ceilings a run is clamped to. The caller may ask for less and never for more,
      # so these are the real limits regardless of what the web tier sends.
      GRADING_DEFAULT_TIMEOUT: ${GRADING_DEFAULT_TIMEOUT:-120s}
      GRADING_DEFAULT_MEMORY_LIMIT: ${GRADING_DEFAULT_MEMORY_LIMIT:-512MB}
      GRADING_DEFAULT_CPU_LIMIT: ${GRADING_DEFAULT_CPU_LIMIT:-1.0}
      GRADING_DEFAULT_PID_LIMIT: ${GRADING_DEFAULT_PID_LIMIT:-256}
      GRADING_NETWORK_ENABLED: ${GRADING_NETWORK_ENABLED:-false}
      GRADING_LOG_SIZE_LIMIT: ${GRADING_LOG_SIZE_LIMIT:-1MB}
      # Binds are resolved by the daemon on the host, so the runner has to know the host
      # paths of the volumes it mounts, exactly as the app did when it held the socket.
      GRADING_DOCKER_WORKSPACE_MOUNT_ROOT: ${GRADING_DOCKER_WORKSPACE_MOUNT_ROOT:-}
      GRADING_DOCKER_TESTS_MOUNT_ROOT: ${GRADING_DOCKER_TESTS_MOUNT_ROOT:-}
      # Both roots are also what a request is checked against: a workspace or a test path
      # outside them is refused before a container exists.
      STORAGE_TESTS_DIRECTORY: /data/tests
      STORAGE_TEMP_DIRECTORY: /data/grading
      STORAGE_REPOSITORIES_DIRECTORY: /data/git/repositories
      STORAGE_TEMPLATES_DIRECTORY: /data/templates
      STORAGE_ARTIFACTS_DIRECTORY: /data/artifacts
      LOG_LEVEL_GITGRADER: ${LOG_LEVEL_GITGRADER:-INFO}
      SPRING_SHUTDOWN_PHASE_TIMEOUT: ${SPRING_SHUTDOWN_PHASE_TIMEOUT:-60s}
      XDG_CONFIG_HOME: /tmp
    volumes:
      - grading-data:/data/grading
      - tests:/data/tests
      - git-data:/data/git
      - templates:/data/templates
      - artifacts:/data/artifacts
      # The socket lives here and nowhere else.
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp
    # A run in progress is worth waiting for, for the same reason the app waits.
    stop_grace_period: 90s
    # The socket is owned by the host's docker group and this container runs
    # unprivileged, so without membership of that group every run fails with a permission
    # error long after startup looked fine. The gid differs per host, so it has no safe
    # default and is required here in order to fail at "up" rather than at the first
    # submission. Find it with: stat -c '%g' /var/run/docker.sock
    group_add:
      - "${DOCKER_GID:?Set DOCKER_GID in .env - see stat -c '%g' /var/run/docker.sock}"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # Docker creates an empty named volume owned by root unless the image already contains
  # the mount path to copy ownership from, and a buildpack image contains no /data tree.
  # The application runs unprivileged, so without this it cannot write to any of its own
  # volumes and fails at startup. This one-shot service adjusts ownership and exits; it
  # is the only container here that needs root, and it holds no ports or secrets.
  # The uid/gid are the ones baked into the application image; if you rebuild on a
  # different base, read them back with:
  #   docker inspect --format '{{.Config.User}}' ghcr.io/git-grader/gitgrader:<tag>
  init-permissions:
    image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    user: "0:0"
    command: ["chown", "-R", "${APP_UID:-1002}:${APP_GID:-1001}",
              "/data/git", "/data/grading", "/data/templates", "/data/tests", "/data/artifacts"]
    volumes:
      - git-data:/data/git
      - grading-data:/data/grading
      - templates:/data/templates
      - tests:/data/tests
      - artifacts:/data/artifacts
    restart: "no"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  database:
    # Pinned by digest for the same reason the alpine helper below is: a tag can be
    # moved, and the database is the one component that carries state a moved tag
    # could silently migrate.
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    restart: unless-stopped
    environment:
      POSTGRES_DB: gitgrader
      POSTGRES_USER: gitgrader
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitgrader -d gitgrader"]
      interval: 10s
      timeout: 5s
      retries: 8
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  database:
  git-data:
  grading-data:
  templates:
  tests:
  artifacts:
