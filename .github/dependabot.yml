version: 2
updates:
- package-ecosystem: maven
  directory: "/"
  schedule:
    interval: weekly
- package-ecosystem: npm
  directory: "/frontend"
  schedule:
    interval: weekly
  ignore:
      # Held at 6 on purpose: this is the copy typescript-eslint resolves, and it
      # refuses to load against 7, so a major bump breaks `npm ci` outright. Type
      # checking runs on 7 via the separate "typescript7" alias, which still gets
      # updates. See docs/development.md.
  - dependency-name: "typescript"
    update-types: ["version-update:semver-major"]
- package-ecosystem: docker
    # These are the grading runtimes' Dockerfiles. Pointed at "/" this found nothing
    # and aborted with "No Dockerfiles nor Kubernetes YAML found in /" on every weekly
    # run, so the base images that untrusted student code executes inside were the
    # ones nothing was watching for updates.
  directory: "/deployment/runtimes/node-22"
  schedule:
    interval: weekly
  ignore:
      # The major version is this runtime's identity: it names the directory, the seeded
      # runtime key and the display name, and assignments pin the image by digest. A new
      # major is a new runtime beside this one, not an edit to it.
  - dependency-name: "node"
    update-types: ["version-update:semver-major"]
- package-ecosystem: docker
  directory: "/deployment/runtimes/node-24"
  schedule:
    interval: weekly
  ignore:
  - dependency-name: "node"
    update-types: ["version-update:semver-major"]
- package-ecosystem: docker
  directory: "/deployment/runtimes/node-26"
  schedule:
    interval: weekly
  ignore:
  - dependency-name: "node"
    update-types: ["version-update:semver-major"]
  # The Python and Java runtimes pin their base images by digest as well, and
  # the same major-is-identity rule applies: a new major is a new runtime, not a
  # change to an existing one, so the major version is excluded from updates.
- package-ecosystem: docker
  directory: "/deployment/runtimes/python-3.14"
  schedule:
    interval: weekly
  ignore:
  # Python's release identity is the minor (3.14 vs 3.15 are different
  # releases, like Node majors), but semver reads 3.14 -> 3.15 as a *minor*
  # bump, so excluding only semver-major let Dependabot move the 3.14 runtime
  # onto a 3.15 base and sync-image-pins then propagated 3.15's digest into a
  # row still labelled 3.14. Exclude minor too; patch-level digest refreshes
  # still come through.
  - dependency-name: "python"
    update-types: ["version-update:semver-major", "version-update:semver-minor"]
- package-ecosystem: docker
  directory: "/deployment/runtimes/java-25"
  schedule:
    interval: weekly
  ignore:
  - dependency-name: "eclipse-temurin"
    update-types: ["version-update:semver-major"]
- package-ecosystem: docker-compose
    # The "docker" ecosystem above reads Dockerfiles only, so the database, the LDAP
    # server, and the alpine helper that owns the data volumes went unwatched.
  directory: "/"
  schedule:
    interval: weekly
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  groups:
    multi-step-actions:
      patterns:
      - actions/cache/*
      - github/codeql-action/*
