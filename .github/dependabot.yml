version: 2
updates:
- package-ecosystem: maven
  directory: /
  schedule:
    interval: weekly
- package-ecosystem: npm
  directory: /frontend
  schedule:
    interval: weekly
  ignore:
  - dependency-name: typescript
    update-types:
    - version-update:semver-major
- package-ecosystem: docker
  directory: /deployment/runtimes/node-22
  schedule:
    interval: weekly
  ignore:
  - dependency-name: node
    update-types:
    - version-update:semver-major
- package-ecosystem: docker
  directory: /deployment/runtimes/node-24
  schedule:
    interval: weekly
  ignore:
  - dependency-name: node
    update-types:
    - version-update:semver-major
- package-ecosystem: docker
  directory: /deployment/runtimes/node-26
  schedule:
    interval: weekly
  ignore:
  - dependency-name: node
    update-types:
    - version-update:semver-major
- package-ecosystem: docker
  directory: /deployment/runtimes/python-3.14
  schedule:
    interval: weekly
  ignore:
  - dependency-name: python
    update-types:
    - version-update:semver-major
- package-ecosystem: docker
  directory: /deployment/runtimes/java-25
  schedule:
    interval: weekly
  ignore:
  - dependency-name: eclipse-temurin
    update-types:
    - version-update:semver-major
- package-ecosystem: docker-compose
  directory: /
  schedule:
    interval: weekly
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  groups:
    multi-step-actions:
      patterns:
      - actions/cache/*
      - github/codeql-action/*
