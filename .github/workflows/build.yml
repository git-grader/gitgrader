name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

# A superseded push has nothing left to prove, and these are the expensive runs: a full
# Maven verify plus an npm install, lint, test and bundle. Tags are excluded from the
# cancellation so a release build is never killed by whatever lands next.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The only full verify in CI: tests, coverage, formatting, Checkstyle, PMD/CPD,
      # SpotBugs, forbidden APIs and the frontend build. The license profile runs here
      # because it is declared but was reached by no workflow, so a missing or altered
      # SPDX header could merge unnoticed.
      - run: ./mvnw -B -Plicense clean verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-and-coverage-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
            **/target/site/jacoco/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: static-analysis-reports
          path: |
            **/target/checkstyle-*.xml
            **/target/pmd.xml
            **/target/cpd.xml
            **/target/spotbugsXml.xml
          if-no-files-found: warn
