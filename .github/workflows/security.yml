name: Security scans

on:
  push:
  pull_request:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read
  security-events: write
  # Required on private repositories: the CodeQL and SARIF upload actions read the
  # workflow run through the Actions API, and without this they fail with
  # "Resource not accessible by integration" before any result is reported.
  actions: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  codeql:
    strategy:
      # One language failing should not cancel the scan of the other.
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'java-kotlin' && 'manual' || 'none' }}
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '25'
      - run: ./mvnw -B -DskipTests package
        if: matrix.language == 'java-kotlin'
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v3
  trivy-filesystem:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
      # The SARIF run above cannot fail the job: the action writes its report and exits 0,
      # so a high or critical finding only ever appeared as a code-scanning alert while the
      # workflow stayed green. This second pass re-reads the cached results and is what
      # actually gates the build. It runs after the upload so the alert is recorded either
      # way, and the findings are printed here so the failure is readable in the log.
      - name: Fail on high or critical findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
