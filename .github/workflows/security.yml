name: Security scans

on:
  push:
  pull_request:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read
  security-events: write
  # Required on private repositories: the CodeQL and SARIF upload actions read the
  # workflow run through the Actions API, and without this they fail with
  # "Resource not accessible by integration" before any result is reported.
  actions: read

jobs:
  codeql:
    strategy:
      # One language failing should not cancel the scan of the other.
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'java-kotlin' && 'manual' || 'none' }}
      - uses: actions/setup-java@v5
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '25'
      - run: ./mvnw -B -DskipTests package
        if: matrix.language == 'java-kotlin'
      - uses: github/codeql-action/analyze@v3
  trivy-filesystem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
  gitleaks:
    runs-on: ubuntu-latest
    # Surfaced as job-level env because the secrets context is available to neither a job
    # nor a step "if". The action requires a paid licence for organisation-owned
    # repositories, so without one this scan is skipped rather than failing every run.
    env:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - if: env.GITLEAKS_LICENSE != ''
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
