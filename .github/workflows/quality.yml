name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B verify -DskipTests
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: static-analysis-reports
          path: |
            **/target/checkstyle-*.xml
            **/target/pmd.xml
            **/target/cpd.xml
            **/target/spotbugsXml.xml
          if-no-files-found: warn
  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # The secrets context is not available to a job-level "if", so the presence of the
      # key is checked inside the step. Guarding the job instead makes the whole workflow
      # file invalid, which GitHub reports as a run that fails instantly with no logs.
      # The downloaded vulnerability feed is what the throttling is about, so it is kept
      # between runs. Restoring it is what makes the check survive a bad day at NIST.
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-data-${{ github.run_id }}
          restore-keys: dependency-check-data-
      - name: Dependency check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "NVD_API_KEY is not configured; skipping the dependency check."
            exit 0
          fi
          ./mvnw -B -Psecurity verify -DskipTests
