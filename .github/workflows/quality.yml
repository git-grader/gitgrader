name: Quality

on:
  push:
    # Branch pushes (e.g. dependabot's) run without repository secrets, so the
    # dependency check failed before it started; the pull_request event already
    # covers those branches and tolerates the missing key.
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # The install and backup scripts are how an operator first meets the project, and no
  # job ever looked at them: the Maven build only knows about Java and the frontend.
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Shellcheck
        run: shellcheck scripts/*.sh deployment/runtimes/*.sh
      # The scripts reach volumes through a helper image that Compose also names, and
      # Dependabot only updates the Compose copy. They drifted to three different Alpine
      # versions before anyone noticed, so the two are compared here.
      # Dependabot bumps the runtime's digest in the Dockerfile and knows nothing about
      # the seeded runtime that pins the same image, so the two drifted apart on the
      # first bump: the demo would then pull an image the repository never built.
      - name: Seeded runtime matches the runtime image
        run: |
          dockerfile=$(grep -oE 'sha256:[a-f0-9]+' deployment/runtimes/node-24/Dockerfile | head -1)
          seeded=$(grep -oE 'sha256:[a-f0-9]+' examples/seed-data.sql | head -1)
          if [ "$dockerfile" != "$seeded" ]; then
            echo "::error::deployment/runtimes/node-24/Dockerfile pins $dockerfile but examples/seed-data.sql pins $seeded"
            exit 1
          fi
          echo "Both pin $dockerfile."
      - name: Helper image matches the deployment
        run: |
          compose=$(grep -oE 'image: alpine:[0-9.]+' compose.yaml | head -1 | cut -d' ' -f2)
          scripts=$(grep -oE 'alpine:[0-9.]+' scripts/lib.sh | head -1)
          if [ "$compose" != "$scripts" ]; then
            echo "::error::compose.yaml uses $compose but scripts/lib.sh uses $scripts"
            exit 1
          fi
          echo "Both use $compose."

  # Static analysis is not repeated here. Build runs the one full `verify` - formatting,
  # Checkstyle, PMD/CPD, SpotBugs, forbidden APIs, frontend lint and licence headers - and
  # running `verify -DskipTests` again repeated all of it plus packaging and the SBOM.
  # Dropping tests did not make that a different gate. What is left is the one scan Build
  # deliberately does not carry, because it depends on an external feed and a secret.
  dependency-check:
    runs-on: ubuntu-latest
    # A cold run downloads the whole NVD feed, which took 55 of the 60 minutes this
    # was previously allowed and left the job killed on the boundary. The headroom is
    # for that cold run; a warm one finishes in a few minutes.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # The secrets context is not available to a job-level "if", so the presence of the
      # key is checked inside the step. Guarding the job instead makes the whole workflow
      # file invalid, which GitHub reports as a run that fails instantly with no logs.
      # The downloaded vulnerability feed is what the throttling is about, so it is kept
      # between runs. Restoring it is what makes the check survive a bad day at NIST.
      #
      # Restore and save are separate because the combined action only writes its cache
      # when the job succeeds. This job's whole purpose is to fail when it finds
      # something, and it had never once succeeded, so the feed was never saved: every
      # run downloaded all 377,000 records again, which is what pushed it past its own
      # timeout and into a failure that then also saved nothing.
      - uses: actions/cache/restore@v6
        id: nvd-cache
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-data-${{ github.run_id }}
          restore-keys: dependency-check-data-
      # A missing key is only tolerated on a pull request, where a fork cannot read
      # repository secrets. On a branch or a schedule it fails: this job existing and
      # passing is what everyone reads as "the dependencies were scanned", and exiting 0
      # having scanned nothing makes that reading false.
      - name: Dependency check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "::warning::NVD_API_KEY is unavailable to this pull request; skipping the dependency check."
              exit 0
            fi
            echo "::error::NVD_API_KEY is not configured, so the dependency check cannot run."
            exit 1
          fi
          ./mvnw -B -Psecurity verify -DskipTests
      - uses: actions/cache/save@v6
        if: always() && steps.nvd-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-data-${{ github.run_id }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-check-report
          path: '**/target/dependency-check-report.*'
          if-no-files-found: ignore
