name: Container image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  IMAGE: ghcr.io/git-grader/gitgrader

# Never cancelled: by the time this is running it may already have pushed a tag, and a
# half-published release is worse than a queued one.
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # workflow_dispatch accepts any ref, and the version was taken from the ref name
      # with the leading "v" stripped. Dispatching from a branch therefore published
      # ghcr.io/git-grader/gitgrader:main and, worse, moved :latest onto it. The ref is
      # checked before anything is built, and only a stable release moves :latest.
      - name: Resolve and validate the release version
        id: release
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::This workflow publishes release tags only, but it was run on ${GITHUB_REF_TYPE} '${GITHUB_REF_NAME}'."
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '${GITHUB_REF_NAME}' is not a semantic version, so it cannot name an image."
            exit 1
          fi
          latest=false
          case "$version" in
            *-*) echo "Pre-release ${version}; :latest will not be moved." ;;
            *) latest=true ;;
          esac
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'latest=%s\n' "$latest" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Buildpacks produce the image directly; there is no Dockerfile in this repository,
      # so the image cannot be built by a Docker build action. The goal runs against the
      # backend module because the aggregator does not carry the Spring Boot plugin.
      #
      # `verify` runs in the same invocation rather than being left to the Build
      # workflow. Build does run on the tag, but nothing joins the two: a red Build did
      # not stop this job from publishing the image and moving :latest onto it, so a
      # release that failed the project's own gate could reach the registry and be
      # pulled as the current one. Tags are rare; paying for the gate here is what makes
      # "it was published" mean "it passed".
      - name: Verify and build the application image
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          ./mvnw -B -Plicense verify spring-boot:build-image -pl backend \
            -Dspring-boot.build-image.imageName="${IMAGE}:${VERSION}"
      - name: Push image
        id: push
        env:
          VERSION: ${{ steps.release.outputs.version }}
          MOVE_LATEST: ${{ steps.release.outputs.latest }}
        run: |
          docker push "${IMAGE}:${VERSION}"
          if [ "$MOVE_LATEST" = "true" ]; then
            docker tag "${IMAGE}:${VERSION}" "${IMAGE}:latest"
            docker push "${IMAGE}:latest"
          fi
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${VERSION}" | cut -d@ -f2)
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/git-grader/gitgrader
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      # Block scalar on purpose: the colon inside "Image digest:" would otherwise be read
      # as a YAML mapping and make the whole workflow file unparseable.
      - run: |
          printf 'Image digest: %s\n' '${{ steps.push.outputs.digest }}'
