name: Container image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  IMAGE: ghcr.io/git-grader/gitgrader

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Buildpacks produce the image directly; there is no Dockerfile in this repository,
      # so the image cannot be built by a Docker build action. The goal runs against the
      # backend module because the aggregator does not carry the Spring Boot plugin.
      - name: Build application image
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./mvnw -B spring-boot:build-image -pl backend \
            -Dspring-boot.build-image.imageName="${IMAGE}:${version}"
      - name: Push image
        id: push
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker tag "${IMAGE}:${version}" "${IMAGE}:latest"
          docker push "${IMAGE}:${version}"
          docker push "${IMAGE}:latest"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${version}" | cut -d@ -f2)
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/git-grader/gitgrader
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      # Block scalar on purpose: the colon inside "Image digest:" would otherwise be read
      # as a YAML mapping and make the whole workflow file unparseable.
      - run: |
          printf 'Image digest: %s\n' '${{ steps.push.outputs.digest }}'
