name: Native image (experimental)

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: Experimental GraalVM native image
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm-community
          cache: maven
      - run: ./mvnw -B -Pnative native:compile
