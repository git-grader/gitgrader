name: SBOM

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Runs on release tags, so it is never cancelled for the same reason the image build is
# not: the SBOM is part of what the release publishes.
concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cyclonedx:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom
      - uses: actions/upload-artifact@v7
        with:
          name: cyclonedx-sbom
          path: |
            **/target/bom.xml
            **/target/bom.json
          if-no-files-found: error
