name: SBOM

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# Runs on release tags, so it is never cancelled for the same reason the image build is
# not: the SBOM is part of what the release publishes.
concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cyclonedx:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # The plugin sets outputName to gitgrader-sbom, so the aggregate lands at
      # backend/target/gitgrader-sbom.{xml,json} and not at target/bom.*. The previous
      # bom.* paths matched nothing: upload-artifact's if-no-files-found: error failed
      # the job, and the release upload below named two files that were never written.
      - run: ./mvnw -B org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cyclonedx-sbom
          path: |
            backend/target/gitgrader-sbom.xml
            backend/target/gitgrader-sbom.json
          if-no-files-found: error
      # An artifact expires with the run. The release is what operators keep, so the
      # aggregate SBOM has to live there too rather than being copied across by hand.
      - name: Attach the SBOM to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes
          gh release upload "$TAG" --clobber \
            backend/target/gitgrader-sbom.xml \
            backend/target/gitgrader-sbom.json
